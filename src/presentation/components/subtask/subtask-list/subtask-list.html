<div class="subtask-list">
 <ul>
    @for (sub of store.subtasks(); track sub.id) {
      <li>
        {{ sub.title }}
        <button (click)="deleteSubtask(sub.id)">Delete</button>
      </li>
       }
  </ul>
  <app-subtask-form [taskId]="taskId!" (create)="createSubtask($event)"></app-subtask-form>
   
</div>
