<div class="task-panel">
  <form class="task-form" [formGroup]="taskForm" (ngSubmit)="submit()">
    <div class="part">
      <!-- Title -->
      <div class="field-block">
        <label class="field-label">
          <i class="pi pi-pencil mr-2"></i>
          Title
        </label>
        <input pInputText formControlName="newTitle" class="field-input" />
      </div>

      <!-- Due Date -->
      <div class="field-block">
        <label class="field-label">
          <i class="pi pi-calendar mr-2"></i>
          Due Date
        </label>
        <p-datepicker formControlName="newDueDate" dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body"
          class="w-full" inputStyleClass="field-input"></p-datepicker>
      </div>
    </div>
    <!-- Status -->
    <div class="field-block">
      <label class="field-label">
        <i class="pi pi-flag mr-2"></i>
        Status
      </label>
      <p-selectButton [options]="statusOptions" formControlName="newStatus" styleClass="status-select"></p-selectButton>
    </div>

    <!-- Description -->
    <div class="field-block">
      <label class="field-label">
        <i class="pi pi-align-left mr-2"></i>
        Description
      </label>
      <textarea pInputTextarea formControlName="newDescription" rows="3" class="field-input"></textarea>
    </div>


    <!-- Actions -->
    <div class="task-dialog-footer">
      <p-button *ngIf="isEdit" type="button" label="Delete" icon="pi pi-trash" severity="danger"
        (click)="remove()"></p-button>

      <p-button type="submit" [label]="isEdit ? 'Update Task' : 'Add Task'" icon="pi pi-check"
        severity="success"></p-button>

    </div>

  </form>
</div>
