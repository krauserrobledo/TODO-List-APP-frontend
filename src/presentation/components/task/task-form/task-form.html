<div class="task-container">
  <h4>Edit Task</h4>
  <form class="task-form" (ngSubmit)="submit()">
    <div>
      <label>Title : </label>
      <input type="text" [(ngModel)]="newTitle" name="title" placeholder="New task..." />
    </div>
    <div>
      <label>Status : </label>
      <select [(ngModel)]="newStatus" name="status">
        <option value="Non Started">Non Started</option>
        <option value="In Progress">In Progress</option>
        <option value="Paused">Paused</option>
        <option value="Late">Late</option>
        <option value="Finished">Finished</option>
      </select>
    </div>
    <div>
      <label>Description : </label>
      <input type="text" [(ngModel)]="newDescription" name="description" placeholder="Describe task..." />
    </div>
    <div>
      <label>Due Date : </label>
      <input type="date" [(ngModel)]="newDueDate" name="dueDate" />
    </div>
    <label>Categories</label>
    <select multiple [(ngModel)]="categories">
      @for (cat of storeCategories.categories(); track cat.id) {
        <option [ngValue]="cat">
          @if (cat) {
            {{ cat.name }}
          } @else {
            Not Available Categories
          }
        </option>
      }
    </select>

    <label>Tags</label>
    <select multiple [(ngModel)]="tags">
      @for (tag of storeTags.tags(); track tag.id) {
        <option [ngValue]="tag">
          @if (tag) {
            {{ tag.name }}
          } @else {
            Not Available Tags
          }
        </option>
      }
    </select>
    

    <div>
    <button class="form-button" type="submit">Add</button>
    <button class="form-button" type="button" (click)="close()">Cancel</button>
  </div>
  </form>
</div>
