@if (task) {
    <div class="task-details">
      <h4>Task Details</h4>
  
      <p><strong>Title:</strong> {{ task.title }}</p>
  
      <p>
        <strong>Status:</strong>
        <select [(ngModel)]="selectedStatus" (change)="changeStatus.emit({ task: task!, status: selectedStatus })">
          <option value="Non Started">Non Started</option>
          <option value="In Progress">In Progress</option>
          <option value="Paused">Paused</option>
          <option value="Late">Late</option>
          <option value="Finished">Finished</option>
        </select>
      </p>
  
      <p><strong>Description:</strong> {{ task.description }}</p>
      <p><strong>Due Date:</strong> {{ task.dueDate | date }}</p>
      <p><strong>Categories:</strong> </p>
      <div *ngFor="let cat of task.categories">
        {{ cat.name }}
      </div>
      
      <p><strong>Tags:</strong></p>
      <div *ngFor="let tag of task.tags">
        {{ tag.name }}
      </div>

      <p><strong>Subtask:</strong></p>
      <div class="task-details">
        <app-subtask-list [taskId]="task.id"></app-subtask-list>
      </div>

      
  
      <div class="actions">
        <button (click)="edit.emit(task!)">Edit</button>
        <button (click)="delete.emit(task!)">Delete</button>
        <button (click)="close.emit()">Close</button>
      </div>
    </div>
  }
