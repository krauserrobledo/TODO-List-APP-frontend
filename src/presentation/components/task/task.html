<div class="task-container">
    <h3>Tasks</h3>
  
    <!-- Loading -->
    <div *ngIf="isLoading()">Loading tasks...</div>
  
    <!-- Error -->
    <div *ngIf="error()">{{ error() }}</div>
  
    <!-- Formulario -->
    <form (ngSubmit)="addTask()" class="task-form">
      <input
        type="text"
        (ngModel)="newTitle()"
        name="title"
        placeholder="New task..."
      />
      <select (ngModel)="newStatus()" name="status">
        <option value="non_started">Non Started</option>
        <option value="in_progress">In Progress</option>
        <option value="paused">Paused</option>
        <option value="late">Late</option>
        <option value="finished">Finished</option>
      </select>
      <button type="submit">Add</button>
    </form>
  
    <!-- Lista -->
    <ul>
      <li *ngFor="let task of tasks()">
        <span [class]="task.status">{{ task.title }}</span>
  
        <!-- Cambiar estado -->
        <select [ngModel]="task.status" (ngModelChange)="changeStatus(task, $event)">
          <option value="non_started">Non Started</option>
          <option value="in_progress">In Progress</option>
          <option value="paused">Paused</option>
          <option value="late">Late</option>
          <option value="finished">Finished</option>
        </select>
  
        <button (click)="deleteTask(task)">Delete</button>
      </li>
    </ul>
  </div>
