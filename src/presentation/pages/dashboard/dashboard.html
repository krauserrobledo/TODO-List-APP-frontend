<div class="app">
    <header class="app-header">
      <nav>
        <h1>Manage your Tasks</h1>
      </nav>
    </header>
  
    <main class="dashboard-grid">

      <div class="left">
        <app-task-list (selectTask)="onSelectTask($event)"></app-task-list>
      </div>

      <div class="center">
        @if (selectedTask) {
          <app-task-details
            [task]="selectedTask"
            (close)="closeDetails()"
            (edit)="editTask($event)"

            (update)="updateTask($event)"
            (delete)="deleteTask($event)"
            (changeStatus)="changeStatus($event)">
          </app-task-details>
        }
      </div>

      <div class="right">
        <p-panel header="Categories" [toggleable]="true">
          <app-category-list></app-category-list>
        </p-panel>
        
        <p-panel header="Tags" [toggleable]="true">
          <app-tag-list></app-tag-list>
        </p-panel>
      </div>
    </main>
</div>
