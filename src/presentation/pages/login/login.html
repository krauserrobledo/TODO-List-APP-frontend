<!-- presentation/pages/login/login.component.html -->
<div class="login-container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <h2>Iniciar Sesión</h2>
      
      @if (authStore.error()) {
        <div class="error-message">
          {{ authStore.error() }}
        </div>
      }
  
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@email.com"
          [class.error]="showEmailError()"
        />
        @if (showEmailError()) {
          <span class="error-text">Email es requerido y debe ser válido</span>
        }
      </div>
  
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.error]="showPasswordError()"
        />
        @if (showPasswordError()) {
          <span class="error-text">Contraseña es requerida</span>
        }
      </div>
  
      <button 
        type="submit" 
        class="login-button"
        [disabled]="authStore.loading() || loginForm.invalid"
      >
        @if (authStore.loading()) {
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>
  </div>
